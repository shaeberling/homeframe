; Homeframe firmware — Good Display ESP32-L(C02) + GDEM133T91 (13.3" 960x680 mono, SSD1677)
[platformio]
default_envs = homeframe

[env:homeframe]
platform  = espressif32@^6.9.0
board     = esp32dev            ; ESP32-WROOM-32D on the ESP32-L board
framework = arduino

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed   = 460800         ; CH340 is unreliable above this

lib_deps =
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.11

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHF_FIRMWARE_VERSION='"0.1.0"'

; Uncomment to keep secrets out of the tree entirely and pass them from the
; environment instead of include/secrets.h:
;   -DWIFI_SSID='"${sysenv.HF_WIFI_SSID}"'
;   -DWIFI_PASSWORD='"${sysenv.HF_WIFI_PASSWORD}"'
