<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>homeframe</title>
<style>
  /* Designed for a 1-bit panel: pure black on pure white, no greys, no
     gradients, no thin hairlines. Anything mid-tone becomes threshold noise.
     Keep body text at 18px+ and prefer 600/700 weights. */
  :root {
    --ink: #000;
    --paper: #fff;
    --rule: 3px solid #000;
    --gap: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Inter", "Helvetica Neue", Helvetica, "DejaVu Sans", Arial, sans-serif;
    -webkit-font-smoothing: none;
  }
  body { display: flex; flex-direction: column; padding: var(--gap); }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: var(--rule); padding-bottom: 11px; flex-shrink: 0;
  }
  header .mark { font-size: 20px; font-weight: 700; letter-spacing: 0.18em; }
  header .stamp { font-size: 20px; font-weight: 600; }

  /* min-height:0 lets the columns shrink instead of pushing the footer off
     the panel; overflow guards against a long agenda doing the same. */
  main { flex: 1; display: flex; gap: var(--gap); padding-top: var(--gap); min-height: 0; overflow: hidden; }
  .col { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; overflow: hidden; }
  .col.left { width: 38%; }
  .col.right { flex: 1; border-left: var(--rule); padding-left: var(--gap); }

  .clock { font-size: 118px; font-weight: 700; line-height: 0.92; letter-spacing: -0.03em; }
  .date { font-size: 30px; font-weight: 600; margin-top: 6px; }

  h2 {
    font-size: 19px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; border-bottom: var(--rule);
    padding-bottom: 8px; margin-bottom: 14px;
  }

  .temp-now { font-size: 62px; font-weight: 700; line-height: 1; }
  .summary { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .range { font-size: 20px; font-weight: 600; margin-top: 8px; }

  .forecast { display: flex; gap: 16px; margin-top: 14px; }
  .forecast > div { flex: 1; border: var(--rule); padding: 8px 10px; }
  .forecast .day { font-size: 18px; font-weight: 700; letter-spacing: 0.1em; }
  .forecast .hi { font-size: 30px; font-weight: 700; margin-top: 4px; }
  .forecast .lo { font-size: 19px; font-weight: 600; }
  .forecast .cond { font-size: 15px; font-weight: 600; margin-top: 4px; line-height: 1.1; white-space: nowrap; }

  ul { list-style: none; }
  .agenda li {
    display: flex; gap: 20px; align-items: baseline;
    padding: 13px 0; border-bottom: 2px solid #000;
  }
  .agenda .time { font-size: 28px; font-weight: 700; min-width: 108px; }
  .agenda .title { font-size: 27px; font-weight: 600; flex: 1; }
  .agenda .who { font-size: 19px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

  .notes li { font-size: 25px; font-weight: 600; padding: 9px 0 9px 30px; position: relative; }
  .notes li::before { content: ""; position: absolute; left: 0; top: 16px; width: 14px; height: 14px; background: #000; }

  .empty { font-size: 22px; font-weight: 600; }

  /* Status bar. Deliberately quiet: it is diagnostics, not content, so it
     reads at a glance without competing with the dashboard above it. */
  footer {
    display: flex; align-items: center; gap: 30px;
    border-top: var(--rule); margin-top: 14px; padding-top: 10px;
    font-size: 17px; font-weight: 600; flex-shrink: 0;
  }
  footer .item { display: flex; align-items: center; gap: 8px; }
  footer .k {
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  footer .right { margin-left: auto; }
  .wifi { width: 38px; height: 33px; display: block; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <span class="mark">HOMEFRAME</span>
    <span class="stamp" id="stamp"></span>
  </header>

  <main>
    <div class="col left">
      <div>
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
      </div>

      <section id="weather-panel">
        <h2>Weather <span id="wx-location"></span></h2>
        <div class="temp-now" id="temp-now"></div>
        <div class="summary" id="summary"></div>
        <div class="range" id="range"></div>
        <div class="forecast" id="forecast"></div>
      </section>
    </div>

    <div class="col right">
      <section id="agenda-panel">
        <h2>Today</h2>
        <ul class="agenda" id="agenda"></ul>
      </section>

      <section id="notes-panel">
        <h2>Notes</h2>
        <ul class="notes" id="notes"></ul>
      </section>
    </div>
  </main>

  <footer id="statusbar">
    <span class="item"><span id="wifi-icon"></span><span id="wifi-dbm"></span></span>
    <span class="item"><span class="k">mem</span><span id="dev-mem"></span></span>
    <span class="item"><span class="k">soc</span><span id="dev-temp"></span></span>
    <span class="item"><span class="k">up</span><span id="dev-up"></span></span>
    <span class="item"><span class="k">link</span><span id="dev-link"></span></span>
    <span class="item right"><span id="dev-fw"></span></span>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);

  function renderWeather(w) {
    if (!w) { $('weather-panel').hidden = true; return; }
    $('wx-location').textContent = w.location ? '\u00b7 ' + w.location : '';
    $('temp-now').textContent = `${Math.round(w.now.temp)}°`;
    $('summary').textContent = w.now.summary;
    $('range').textContent =
      `${Math.round(w.today.high)}° / ${Math.round(w.today.low)}°   ·   ${w.today.precipitation}% rain`;
    $('forecast').innerHTML = (w.forecast ?? []).map((d) => `
      <div>
        <div class="day">${d.day}</div>
        <div class="hi">${Math.round(d.high)}°</div>
        <div class="lo">${Math.round(d.low)}°</div>
        <div class="cond">${d.summary || ''}</div>
      </div>`).join('');
  }

  function renderAgenda(items) {
    if (!items) { $('agenda-panel').hidden = true; return; }
    $('agenda').innerHTML = items.length
      ? items.map((e) => `
          <li>
            <span class="time">${e.time}</span>
            <span class="title">${e.title}</span>
            <span class="who">${e.who ?? ''}</span>
          </li>`).join('')
      : '<li class="empty">Nothing scheduled</li>';
  }

  function renderNotes(items) {
    if (!items || items.length === 0) { $('notes-panel').hidden = true; return; }
    $('notes').innerHTML = items.map((n) => `<li>${n}</li>`).join('');
  }

  // Four nested arcs over a dot. Active arcs are solid and heavy; inactive
  // ones are dotted rather than grey, because the panel has no grey — a
  // 50% tint would threshold to solid black or vanish entirely.
  function wifiIcon(bars) {
    // Geometry is spacing-driven: at ~88dpi a gap under about 2px between
    // strokes closes up when the greyscale is thresholded, and the fan reads
    // as one solid wedge. Radii are spaced 4.5 units against a 2.4 stroke.
    const cx = 14, cy = 21;
    const arcs = [4, 8.5, 13, 17.5].map((r, i) => {
      const d = (0.7071 * r).toFixed(2);
      const x1 = (cx - d).toFixed(2), x2 = (cx + Number(d)).toFixed(2);
      const y = (cy - d).toFixed(2);
      const on = i < bars;
      return `<path d="M ${x1},${y} A ${r},${r} 0 0,1 ${x2},${y}"
        fill="none" stroke="#000" stroke-linecap="round"
        stroke-width="${on ? 2.4 : 1.5}"${on ? '' : ' stroke-dasharray="0.1 3.6"'} />`;
    }).join('');
    const dot = `<circle cx="${cx}" cy="${cy}" r="2"
      fill="${bars > 0 ? '#000' : 'none'}" stroke="#000" stroke-width="1.5" />`;
    return `<svg viewBox="0 0 28 24" class="wifi">${arcs}${dot}</svg>`;
  }

  function formatUptime(min) {
    if (min < 60) return `${min}m`;
    const h = Math.floor(min / 60);
    return h < 24 ? `${h}h ${min % 60}m` : `${Math.floor(h / 24)}d ${h % 24}h`;
  }

  function renderDevice(d) {
    if (!d) {
      $('statusbar').innerHTML =
        '<span class="item">awaiting first device check-in</span>';
      return;
    }
    $('wifi-icon').innerHTML = wifiIcon(d.bars);
    $('wifi-dbm').textContent = d.rssi === null ? '--' : `${d.rssi} dBm`;
    $('dev-mem').textContent =
      d.heapFree === null ? '--' : `${Math.round(d.heapFree / 1024)} KB`;
    $('dev-temp').textContent =
      d.socTemp === null ? '--' : `${d.socTemp.toFixed(1)}\u00b0C`;
    $('dev-up').textContent = formatUptime(d.uptimeMin);
    $('dev-link').textContent = d.transferMs === null ? '--' : `${d.transferMs} ms`;
    $('dev-fw').textContent = d.version ? `v${d.version}` : '';
  }

  (async () => {
    try {
      const data = await (await fetch('/api/data')).json();
      $('clock').textContent = data.clock;
      $('date').textContent = data.date;
      $('stamp').textContent = `updated ${data.clock}`;
      renderWeather(data.weather);
      renderAgenda(data.agenda);
      renderNotes(data.notes);
      renderDevice(data.device);
    } catch (err) {
      $('date').textContent = 'dashboard data unavailable';
      console.error(err);
    } finally {
      // render.js waits on this before screenshotting.
      await document.fonts.ready;
      window.__hfReady = true;
    }
  })();
</script>
</body>
</html>
